# Example controller config with inline notes. Replace placeholder secrets
# before deploying to real environments.
# NOTE: controller 只消费 paths.*（global/pathProfiles/pathRules）；示例配置已按最终 schema 收敛。
apiToken: "replace-with-controller-api-token" # Required Bearer token protecting all controller HTTP APIs; keep non-empty
bootstrapVersion: "bootstrap-2025-11-25" # Version string echoed in /bootstrap responses for cache invalidation; bump to force refresh
rulesVersion: "decision-2025-11-25" # Version tag for /decision payloads; bump to invalidate decision cache
listenAddr: ":8080" # Listen address for controller HTTP server (host:port); default ":8080"

envs:
  staging: # Staging environment configuration
    common:
      alistBaseUrl: "https://alist-staging.example.com" # Base URL of upstream AList instance
      alistAuthHeaders:
        Authorization: "Bearer staging-alist-token" # Extra headers sent to AList (token, cookies etc.)
      tokenHmacKeyId: "default" # Key ID placed in issued tokens
      tokenHmacKey: "replace-with-hmac-key" # HMAC secret for issuing/validating tickets
      signSecret: "" # Optional override secret for landing ?sign verification (defaults to tokenHmacKey)
      workerAddresses:
        - "https://download-staging.example.com" # Download worker endpoints for issued tickets; non-empty list in prod
      landingWorkerAddresses:
        - "https://landing-staging.example.com" # Landing worker origins allowed to issue tickets
      binding:
        version: 1 # bindingStr schema version
        defaultModes: "path,asn,country,iprange" # Default binding modes for download decision fallback
        ipv4Suffix: "/32" # CIDR suffix for IPv4 binding (iprange)
        ipv6Suffix: "/60" # CIDR suffix for IPv6 binding (iprange)
        bindTls: true # Whether to require TLS fingerprint binding when tls mode is enabled
    landing: # Landing-side configuration for staging
      pageSecret: "replace-with-page-secret" # Used to sign/validate landing page state/token (non-empty when signatures required)
      frontend:
        glueUrl: "https://cdn.jsdelivr.net/gh/your-org/alist-landing-worker@<commit>/src/assets/landing/landing-glue.js" # Frontend module URL (required)
        htmlUrl: "https://cdn.jsdelivr.net/gh/your-org/alist-landing-worker@<commit>/src/assets/landing/landing.html" # Landing HTML URL (required)
        commonCssUrl: "https://cdn.jsdelivr.net/gh/your-org/alist-landing-worker@<commit>/src/assets/landing/landing.common.css" # Common layout CSS URL (required)
        themeCssUrl: "https://cdn.jsdelivr.net/gh/your-org/alist-landing-worker@<commit>/src/assets/landing/landing.minimal.css" # Default theme CSS URL (required)
      captchaBinding:
        version: 1 # bindingStr schema version used by challenges
        defaultModes: "path,iprange" # Challenge binding modes; overrides common/decision when set
        ipv4Suffix: "/32" # CIDR suffix for IPv4 binding (iprange)
        ipv6Suffix: "/128" # CIDR suffix for IPv6 binding (iprange)
        bindTls: true # Whether to require TLS fingerprint binding when tls mode is enabled
      captcha:
        defaultCombo: ["verify-altcha"] # Ordered challenge pipeline; allowed: verify-altcha|verify-turn|verify-turnstile|verify-powdet-argon2id|verify-powdet-argon2d|verify-powdet-randomx|verify-none; empty array = no challenge
      turnstile:
        enabled: false # Enable Cloudflare Turnstile challenge (default=false)
        renderMode: "visible" # Render mode: visible | invisible
        siteKey: "" # Turnstile site key used by frontend (required if enabled)
        secretKey: "" # Turnstile secret for server-side verification (required if enabled)
        tokenBinding: true # Whether to bind Turnstile token to device info; default=true
        tokenTTLSeconds: 600 # TTL for Turnstile tokens; >0, default=600
        tokenTable: "TURNSTILE_TOKEN_BINDING" # Table name for token binding storage
        cookieExpireSeconds: 120 # How long the Turnstile cookie lives; seconds, default=120
        expectedAction: "download" # Expected Turnstile action string; non-empty when enforceAction=true
        enforceAction: true # Enforce expectedAction check; default=true
        enforceHostname: false # Enforce hostname check from Turnstile token; default=false
        allowedHostnames: [] # Optional allowlist of hostnames; empty means accept any when enforceHostname=false
      altcha:
        enabled: true # Enable built-in ALTCHA challenge (default=true)
        baseDifficultyMin: 250000 # Minimum puzzle difficulty; >0, must be <= baseDifficultyMax
        baseDifficultyMax: 250000 # Maximum puzzle difficulty; >= baseDifficultyMin
        tokenExpireSeconds: 180 # TTL for ALTCHA tokens; >0, default=180
        tokenTable: "ALTCHA_TOKEN_LIST" # Table name for issued ALTCHA tokens
        difficultyWindowSeconds: 30 # Window for dynamic difficulty; seconds, >0
        difficultyResetSeconds: 120 # Reset interval for difficulty window; seconds, >0
        maxBlockSeconds: 120 # Maximum block time when difficulty spikes; seconds, >=0
        maxExponent: 10 # Maximum exponent multiplier for difficulty upgrades; >=0
        minUpgradeExponent: 3 # Minimum exponent when upgrading difficulty; >=0 and <= maxExponent
      fastRedirect: false # If true, bypass intermediate page and redirect faster; default=false
      autoRedirect: false # If true, auto-jump to download after verification; default=false
      ipv4Only: false # Force IPv4-only traffic handling on landing; default=false
      downloadWorkerHrwEnabled: false # Use HRW to select download worker for small files; default=false
      downloadWorkerHrwMaxSize: "500MB" # HRW applies when filesize <= this size; supports <number>[B|KB|MB|GB]
      paths: # Landing path profile/rule schema；将静态动作收敛进 bootstrap
        global:
          # defaultProfileId：未命中任何规则时使用的 profileId；必须出现在 pathProfiles[].id 中
          defaultProfileId: "landing-default"
          # decisionTimeoutMs：预留字段，用于 future 对动态决策设置超时时间；当前 Worker 未使用，可以留空或保持默认
        # pathProfiles：按 profileId 分组的「静态策略模板」；dynamic 控制是否额外调用 /decision
        pathProfiles:
          - id: "landing-default" # profile 唯一 ID，供 pathRules.profileId 引用
            dynamic: false # 是否动态：false=只用 actions 静态策略；true=静态策略 + 调用 /decision 叠加动态结果
            actions:
              # captchaCombo：验证码链；枚举值：
              # - verify-altcha
              # - verify-turn
              # - verify-turnstile
              # - verify-powdet-argon2id
              # - verify-powdet-argon2d
              # - verify-powdet-randomx
              # - verify-none            （显式跳过验证码）
              # 以及以下「路径动作为伪验证码值」：
              # - block                  （直接阻断访问）
              # - pass-web               （走 web downloader）
              # - pass-server            （走纯后端下载）
              # - pass-asis              （保持默认行为，由前端/后端根据配置决定）
              # 可以按顺序组合，例如 ["verify-altcha","verify-powdet-argon2id"] 或 ["verify-altcha","verify-powdet-randomx"]；block/pass-* 一般单独使用。
              captchaCombo: ["verify-altcha"]
              # fastRedirect/autoRedirect：覆盖 landing.fastRedirect/autoRedirect 的布尔值（可选）
              fastRedirect: false
              autoRedirect: false
          - id: "landing-block-admin"
            dynamic: false
            actions:
              # 对管理路径的策略：直接 block，并带上 blockReason
              captchaCombo: ["block"]
              fastRedirect: false
              autoRedirect: false
              blockReason: "blocked by rule landing_block_admin" # 展示/记录用的阻断原因
          - id: "landing-public"
            dynamic: false
            actions:
              # 对公共路径：直接放行（pass-asis），不额外验证码
              captchaCombo: ["pass-asis"]
              fastRedirect: false
              autoRedirect: false
        # pathRules：按 pattern → profileId 映射；priority 越大优先级越高
        pathRules:
          # pattern 语法：支持前缀+glob，"**" 表示任意多级目录，"*" 表示单级目录：
          #  - "/public/**"  匹配 /public/ 下所有路径
          #  - "/share/*"    匹配 /share/ 下单层文件（不含子目录）
          # 如未显式指定 priority，默认视为 0；同一请求命中多条规则时，优先选择 priority 最大的那条。
          - pattern: "/admin/**"
            profileId: "landing-block-admin"
            priority: 300 # 管理路径优先级最高
          - pattern: "/internal/**"
            profileId: "landing-block-admin"
            priority: 300
          - pattern: "/public/**"
            profileId: "landing-public"
            priority: 200
          - pattern: "/share/**"
            profileId: "landing-public"
            priority: 200
      powdet:
        enabled: false # Whether landing delegates PoW to external powdet service (default=false)
        baseUrl: "" # powdet API base URL; required if enabled
        staticBaseUrl: "" # Powdet static base (global); optional, algo.staticBaseUrl has higher priority
        token: "" # powdet API token; required if enabled
        table: "POW_CHALLENGE_TICKET" # Table for powdet tickets
        difficultyTable: "POWDET_DIFFICULTY_STATE" # Default table for powdet difficulty state
        expireSeconds: 180 # powdet ticket TTL; >0
        clockSkewSeconds: 60 # Allowed client clock skew when validating tickets; seconds >=0
        maxWindowSeconds: 600 # Max rolling window considered for difficulty; seconds >=0
        algorithms:
          argon2id:
            enabled: true # Allowed when enabled; actual enforcement depends on captchaCombo tokens
            staticLevel: 12 # Base difficulty when dynamic is disabled; >=0
            difficultyTable: "POWDET_DIFFICULTY_STATE"
            dynamic: # Adaptive difficulty parameters (argon2id)
              windowSeconds: 60 # Rolling window for leveling up; seconds >0
              resetSeconds: 300 # Cooldown to decay level; seconds >0
              blockSeconds: 300 # Block duration after reaching max level; seconds >=0
              baseLevelMin: 12 # Minimum base level for difficulty mapping; >=0
              baseLevelMax: 20 # Maximum base level; >= baseLevelMin
              levelStep: 1 # Difficulty increment per level; >0
              maxLevel: 4 # Maximum dynamic level; >=0
          argon2d:
            enabled: false # Allowed when enabled; actual enforcement depends on captchaCombo tokens
            staticLevel: 12 # Base difficulty when dynamic is disabled; >=0
            difficultyTable: "POWDET_DIFFICULTY_STATE"
            dynamic: # Adaptive difficulty parameters (argon2d)
              windowSeconds: 60
              resetSeconds: 300
              blockSeconds: 300
              baseLevelMin: 12
              baseLevelMax: 20
              levelStep: 1
              maxLevel: 4
          randomx:
            enabled: false # Allowed when enabled; actual enforcement depends on captchaCombo tokens
            staticLevel: 12
            difficultyTable: "POWDET_DIFFICULTY_STATE"
            staticBaseUrl: "" # Optional override for randomx static assets (highest priority)
            dynamic:
              windowSeconds: 60
              resetSeconds: 300
              blockSeconds: 300
              baseLevelMin: 12
              baseLevelMax: 20
              levelStep: 1
              maxLevel: 4
      db:
        mode: "custom-pg-rest" # Database mode; allowed: "" (disabled) | "custom-pg-rest"
        postgrestUrl: "https://postgrest-staging.example.com" # PostgREST endpoint used by landing; required if mode set
        verifyHeader: ["X-Postgrest-Auth"] # Header names to authenticate PostgREST calls; must align with verifySecret length
        verifySecret: ["replace-with-postgrest-secret"] # Corresponding header values
        cleanupPercentage: 5 # Chance (0-100) to trigger landing-side cleanup jobs; set 0 to disable
        cache:
          tableName: "FILESIZE_CACHE_TABLE" # Table holding file size cache
          sizeTTLSeconds: 86400 # TTL for cached sizes; seconds >0
          cleanupPercentage: 5 # Chance (0-100) of cache cleanup per request
        rateLimit:
          enabled: false # Landing-side rate limit toggle (default=false)
          windowSeconds: 60 # Rate limit window in seconds; >0 when enabled
          limit: 0 # Max operations per window; 0 means unlimited when enabled=false
          ipv4Suffix: "/32" # CIDR suffix used for IPv4 bucketing
          ipv6Suffix: "/60" # CIDR suffix used for IPv6 bucketing
          blockSeconds: 600 # Block duration after limit exceeded; seconds >=0
          pgErrorHandle: "fail-closed" # Behavior on DB errors; allowed: fail-closed|fail-open
          fileWindowSeconds: 60 # File-specific rate limit window; seconds >0
          fileLimit: 0 # Max file-specific operations per window; 0 means unlimited
          fileBlockSeconds: 240 # Block duration for file-level limit; seconds >=0
          tableName: "IP_LIMIT_TABLE" # Table storing IP rate limit entries
          fileTableName: "IP_FILE_LIMIT_TABLE" # Table storing file-level limits
          cleanupPercentage: 5 # Chance (0-100) of cleaning rate limit tables
        idleTable: "DOWNLOAD_LAST_ACTIVE_TABLE" # Table tracking landing idle time (shared with download worker init.sql)
        idleTimeoutSeconds: 0 # Idle timeout before cleanup; 0 disables
      crypt:
        prefix: "" # Path prefix requiring encryption; empty disables
        includes: [] # Additional path includes for crypt
        encryptionMode: "crypt" # Encryption mode identifier; allowed: crypt|none
        fileHeaderSize: 32 # Bytes reserved for file header in crypt mode; >0 when enabled
        blockHeaderSize: 16 # Bytes reserved per block header; >0 when enabled
        blockDataSize: 65536 # Bytes per encrypted block payload; >0 when enabled
        dataKey: "" # Symmetric encryption key; required when encryptionMode=crypt
      webDownloader:
        enabled: false # Enable web downloader UI (default=false)
        maxConnections: 16 # Max concurrent connections in web downloader; >0
      clientDecryptEnabled: false # Allow client-side decryption; default=false
      payload:
        minBandwidthMbps: 10 # Min bandwidth used to estimate expireTime; Mbps, 0 means no check
        minDurationSeconds: 3600 # Minimum allowed download duration; seconds, >=0
        maxDurationSeconds: 0 # Maximum allowed duration; 0 means unlimited
    download: # Download-side configuration for staging
      address: "https://alist-staging.example.com" # Upstream AList address for download links; must be https://...; required
      override-cache-control: false # Force override upstream Cache-Control in download response; default=false
      cache-override-time: "30m" # Required when override-cache-control=true; supports <number>[s|m|h|d|w|y]
      cache-override-max-size: "500MB" # Max file size eligible for override; supports <number>[B|KB|MB|GB]
      auth:
        ipv4Only: true # Only allow IPv4 clients for downloads; default=true
      db:
        mode: "custom-pg-rest" # Database mode used by download worker; allowed: "" | "custom-pg-rest"
        postgrestUrl: "https://postgrest-staging.example.com" # PostgREST endpoint for download tables; required if mode set
        verifyHeader: ["X-Postgrest-Auth"] # Headers carrying PostgREST auth; length must match verifySecret
        verifySecret: ["replace-with-postgrest-secret"] # Values for PostgREST auth headers
        cacheEnabled: true # Explicitly enable download cache; required when mode=custom-pg-rest
        cacheTable: "DOWNLOAD_CACHE_TABLE" # Table storing download cache entries (must match init2.sql)
        linkTTLSeconds: 1800 # TTL for cached download links; seconds >0
        cleanupPercentage: 1 # Chance (0-100) of running cache cleanup per request
        idleTimeoutSeconds: 0 # Idle timeout before evicting sessions; 0 disables
        lastActiveTable: "DOWNLOAD_LAST_ACTIVE_TABLE" # Table for tracking last active time (must match init2.sql)
        rateLimit:
          enabled: false # Toggle IP rate limiting on download worker (default=false)
          windowSeconds: 0 # Rate limit window in seconds; >0 when enabled
          limit: 0 # Allowed actions per window; 0 means unlimited when disabled
          ipv4Suffix: "/32" # IPv4 bucket size for rate limiting (CIDR suffix)
          ipv6Suffix: "/60" # IPv6 bucket size for rate limiting (CIDR suffix)
          blockSeconds: 600 # Block duration when limit exceeded; seconds >=0
          pgErrorHandle: "fail-closed" # Behavior on DB errors; allowed: fail-closed|fail-open
          tableName: "DOWNLOAD_IP_RATELIMIT_TABLE" # Table storing rate limit counters (must match init2.sql)
          cleanupPercentage: 1 # Chance (0-100) of cleaning rate-limit table
      fairQueue:
        enabled: true # Enable Fair Queue via slot-handler (default=true)
        backend: "slot-handler" # Backend provider for FQ; allowed: slot-handler|off
        hostPatterns: ["*.sharepoint.com"] # Hosts controlled by slot-handler; glob list
        slotHandlerUrl: "https://slot-handler-staging.example.com" # slot-handler endpoint; required if enabled
        slotHandlerAuthKey: "replace-with-slot-handler-key" # Auth key sent to slot-handler; required if enabled
        slotHandlerAuthHeader: "X-FQ-Auth" # Header name sent to slot-handler; must match slotHandler.auth.header
        slotHandlerTimeoutMs: 20000 # Total wait budget before giving up; ms >0
        perRequestTimeoutMs: 8000 # Timeout per slot-handler request; ms >0
        maxAttemptsCap: 35 # Max retry attempts for slot acquisition; >=1
        siteBucket:
          mode: "sharepoint" # Derive site bucket by SharePoint path segments
      throttleProfiles:
        default:
          hostPatterns: [] # Host patterns this throttle profile applies to; glob list
          openCapSeconds: 60 # Max open duration or numeric Retry-After cap applied by the worker; seconds >0
          openThresholdPercent: 30 # Breaker open threshold for EWMA error score; percent >0; default comes from controller
          ewmaSpan: 8 # EWMA smoothing span used by the breaker state machine; >0
          consecutiveThreshold: 4 # Consecutive protected responses that can trip quickly; >=1
          minSamplesBeforeEwmaOpen: 8 # Minimum post-reset samples before EWMA can open the breaker; >0; default comes from controller
          idleResetSeconds: 900 # Closed-state idle gap that clears breaker memory before the next sample; seconds >0; default comes from controller
          protectHttpCodes: [429, 499, 500, 502, 503, 504] # Status codes considered errors; list of ints
      originBindingDefault: "path,asn,country,iprange" # Default binding mode; allowed tokens: ip|iprange|country|continent|region|city|asn|tls|path (comma-separated); empty string disables binding
      paths: # Download 侧 path profile/rule schema；决定 pathAction / FQ profile / throttle profile 等
        global:
          # defaultProfileId：未命中任何规则时使用的 profileId；必须出现在 pathProfiles[].id 中
          defaultProfileId: "download-default"
          # decisionTimeoutMs：预留字段，用于 future 控制动态决策超时时间；当前 Worker 未使用
        # pathProfiles：按 profileId 分组的「下载路径策略模板」
        pathProfiles:
          - id: "download-default"
            dynamic: false # 是否动态：false=只用 actions 静态策略；true=静态策略 + /decision 叠加
            actions:
              # pathAction：下载路径行为列表；枚举值：
              # - block        ：直接阻断
               # - asis         ：保持默认行为
              # 组合规则：
              # - "block" 和 "asis" 互斥；出现其中之一时应单独使用。
              pathAction: []
              # checkOriginMode：origin 绑定/校验模式（逗号分隔的 token 列表）；枚举值：
              #   ip | iprange | country | continent | region | city | asn | tls | path
              # 例如：
              #   "path,asn,country,iprange"（默认）  → 按 path + ASN + country + IP 段绑定；
              #   "ip"                   → 单 IP 绑定；
              #   "country,asn"          → 国家 + ASN 绑定。
              checkOriginMode: "path,asn,country,iprange"
              # throttleProfile：Throttle 策略名称；必须出现在 download.throttleProfiles.* 中，例如：default
              throttleProfile: "default"
          - id: "download-block-admin"
            dynamic: false
            actions:
              pathAction: ["block"] # 管理路径全部阻断
              checkOriginMode: "path,asn,country,iprange"
              throttleProfile: "default"
              blockReason: "blocked by rule block_admin" # 可选，供日志/前端提示使用
          - id: "download-public-share"
            dynamic: false
            actions:
              pathAction: [] # 公共分享路径保持默认行为
              checkOriginMode: "path,asn,country,iprange"
              throttleProfile: "default"
          - id: "download-public-share-passthrough"
            dynamic: false
            actions:
              pathAction: ["asis"] # 公共分享中某些路径完全 passthrough
              checkOriginMode: "path,asn,country,iprange"
              throttleProfile: "default"
        # pathRules：按 pattern → profileId 映射；priority 越大优先级越高，未设置时视为 0
        pathRules:
          # pattern 语法与 landing 相同：支持前缀 + glob
          # - "/share/**"          → /share/ 下所有层级
          # - "/share/public/**"   → 更细粒度的 public 子目录
          # 同一请求命中多条规则时，选择 priority 最大的一条；若相等则按配置顺序选择先出现的。
          - pattern: "/admin/**"
            profileId: "download-block-admin"
            priority: 300
          - pattern: "/internal/**"
            profileId: "download-block-admin"
            priority: 300
          - pattern: "/share/**"
            profileId: "download-public-share"
            priority: 200
          - pattern: "/share/public/**"
            profileId: "download-public-share-passthrough"
            priority: 100
    powdet: # powdet service configuration for staging
      enabled: true # Whether to run powdet service in staging; default=true
      listenPort: 2370 # powdet listen port; >0, default=2370
      batchSize: 1000 # Number of challenges per batch; >=1
      deprecateAfterBatches: 10 # How many batches before rotating challenges; >=0
      algorithms:
        argon2id:
          enabled: true
          memoryKiB: 16384 # Argon2 memory cost; >0
          iterations: 2 # Argon2 iterations; >0
          parallelism: 1 # Argon2 parallelism; >0
          keyLength: 16 # Argon2 key length; >0
        argon2d:
          enabled: false
          memoryKiB: 16384
          iterations: 2
          parallelism: 1
          keyLength: 16
        randomx:
          enabled: false
          jit: true
          hardAes: true
          largePages: false
          seedLen: 32
          cacheLRUSize: 128
          cacheTTL: 600
      adminApiToken: "replace-with-admin-token" # Token to protect powdet admin endpoints; required if admin API exposed
    slotHandler: # slot-handler config for staging (prod mirrors structure)
      listen: ":8080" # Slot-handler listen address; host:port
      logLevel: "info" # Logging level for slot-handler; allowed: debug|info|warn|error
      auth:
        enabled: true # Whether to enforce auth on slot-handler API; default=true
        header: "X-FQ-Auth" # Header name carrying auth token
        token: "replace-with-slot-handler-key" # Token required by slot-handler; required if auth.enabled
      backend:
        mode: "postgrest" # Backend mode: postgrest|postgres
        postgrest:
          baseUrl: "https://postgrest-staging.example.com" # PostgREST endpoint used by slot-handler; required if mode=postgrest
          authHeader: "Bearer replace-with-postgrest-token" # Auth header for PostgREST calls; string
        postgres:
          dsn: "postgres://user:pass@host:5432/dbname?sslmode=disable" # Direct Postgres DSN (optional when using postgres mode)
      fairQueue:
        pollIntervalMs: 500 # Poll interval when waiting for slot; ms >0
        pollWindowMs: 6000 # Poll window length; ms >0
        minSlotHoldMs: 800 # Minimum hold time after grant before release; ms >=0
        smoothReleaseIntervalMs: null # Interval for gradual release smoothing; null disables
        graceMs: 4000 # Grace window for recent grants before utilization; ms >0
        utilWindowSec: 10 # Utilization window length used by scheduler; seconds >0; source: simple-alist-cf-proxy@845175d/slot-handler/main.go utilWindowSeconds() (current implementation clips >30 to 30)
        maxBatch: 8 # Max number of acquire requests per batch; >=1
        maxProbeParallel: 4 # Max parallel probe calls per host; >=1
        maxProbeQpsPerHost: 20 # Max probe QPS per host; >=1
        globalMaxInFlightFlow: 300 # in-flight 上限（0 表示禁用该层限制）
        hostMaxInFlightFlow: 100 # in-flight 上限（0 表示禁用该层限制）
        siteMaxInFlightFlow: 50 # in-flight 上限（0 表示禁用该层限制）
        ipBucketMaxInFlightFlow: 10 # in-flight 上限（0 表示禁用该层限制）
        zombieTimeoutSeconds: 30 # Timeout for zombie sessions; seconds >=0
        ipCooldownSeconds: 0 # Cooldown for IP after release; seconds >=0
        hostCaps:
          maxSlotPerHost: 5 # Slot cap per host; 0 = unlimited
          maxSlotPerIp: 1 # Slot cap per IP; 0 = unlimited
        siteCaps:
          maxSlotPerSite: 5 # Slot cap per site; 0 = unlimited
          maxSlotPerIp: 1 # Slot cap per IP; 0 = unlimited
        rpc:
          tryAcquireFunc: "fq_try_acquire_batch" # Batch RPC to attempt slot acquisition
          releaseFunc: "fq_release_dual" # RPC to release slot
        cleanup:
          enabled: true # Enable periodic cleanup; default=true
          intervalSeconds: 1800 # Interval for cleanup job; seconds >0

  prod: # Production environment (same schema as staging; see staging comments for ranges/enums and fill real values)
    common:
      alistBaseUrl: "https://alist.example.com"
      alistAuthHeaders:
        Authorization: "Bearer prod-alist-token"
      tokenHmacKeyId: "default"
      tokenHmacKey: "replace-with-hmac-key"
      signSecret: ""
      workerAddresses:
        - "https://download.example.com"
      landingWorkerAddresses:
        - "https://landing.example.com"
      binding:
        version: 1
        defaultModes: "path,asn,country,iprange"
        ipv4Suffix: "/32"
        ipv6Suffix: "/60"
        bindTls: true
    # All prod sub-sections mirror staging; allowed values/defaults/ranges are identical.
    landing: # Production landing config; field meanings match staging.landing
      pageSecret: "replace-with-page-secret"
      frontend:
        glueUrl: "https://cdn.jsdelivr.net/gh/your-org/alist-landing-worker@<commit>/src/assets/landing/landing-glue.js" # Frontend module URL (required)
        htmlUrl: "https://cdn.jsdelivr.net/gh/your-org/alist-landing-worker@<commit>/src/assets/landing/landing.html" # Landing HTML URL (required)
        commonCssUrl: "https://cdn.jsdelivr.net/gh/your-org/alist-landing-worker@<commit>/src/assets/landing/landing.common.css" # Common layout CSS URL (required)
        themeCssUrl: "https://cdn.jsdelivr.net/gh/your-org/alist-landing-worker@<commit>/src/assets/landing/landing.minimal.css" # Default theme CSS URL (required)
      captchaBinding:
        version: 1
        defaultModes: "path,iprange"
        ipv4Suffix: "/32"
        ipv6Suffix: "/128"
        bindTls: true
      captcha:
        defaultCombo: ["verify-altcha"] # Same enum as staging: verify-altcha|verify-turn|verify-turnstile|verify-powdet-argon2id|verify-powdet-argon2d|verify-powdet-randomx|verify-none; order defines pipeline
      turnstile:
        enabled: false
        renderMode: "visible"
        siteKey: ""
        secretKey: ""
        tokenBinding: true
        tokenTTLSeconds: 600
        tokenTable: "TURNSTILE_TOKEN_BINDING"
        cookieExpireSeconds: 120
        expectedAction: "download"
        enforceAction: true
        enforceHostname: false
        allowedHostnames: []
      altcha:
        enabled: true
        baseDifficultyMin: 250000
        baseDifficultyMax: 250000
        tokenExpireSeconds: 180
        tokenTable: "ALTCHA_TOKEN_LIST"
        difficultyWindowSeconds: 30
        difficultyResetSeconds: 120
        maxBlockSeconds: 120
        maxExponent: 10
        minUpgradeExponent: 3
      fastRedirect: false
      autoRedirect: false
      ipv4Only: false
      downloadWorkerHrwEnabled: false
      downloadWorkerHrwMaxSize: "500MB"
      paths:
        global:
          defaultProfileId: "landing-default"
        pathProfiles:
          - id: "landing-default"
            dynamic: false
            actions:
              captchaCombo: ["verify-altcha"]
              fastRedirect: false
              autoRedirect: false
          - id: "landing-block-admin"
            dynamic: false
            actions:
              captchaCombo: ["block"]
              fastRedirect: false
              autoRedirect: false
              blockReason: "blocked by rule landing_block_admin"
          - id: "landing-public"
            dynamic: false
            actions:
              captchaCombo: ["pass-asis"]
              fastRedirect: false
              autoRedirect: false
        pathRules:
          - pattern: "/admin/**"
            profileId: "landing-block-admin"
            priority: 300
          - pattern: "/internal/**"
            profileId: "landing-block-admin"
            priority: 300
          - pattern: "/public/**"
            profileId: "landing-public"
            priority: 200
          - pattern: "/share/**"
            profileId: "landing-public"
            priority: 200
      powdet:
        enabled: true
        baseUrl: "https://powdet.example.com"
        staticBaseUrl: "" # Powdet static base (global); optional, algo.staticBaseUrl has higher priority
        token: "replace-with-powdet-token"
        table: "POW_CHALLENGE_TICKET"
        difficultyTable: "POWDET_DIFFICULTY_STATE"
        expireSeconds: 180
        clockSkewSeconds: 60
        maxWindowSeconds: 600
        algorithms:
          argon2id:
            enabled: true # Allowed when enabled; actual enforcement depends on captchaCombo tokens
            staticLevel: 12
            difficultyTable: "POWDET_DIFFICULTY_STATE"
            dynamic:
              windowSeconds: 60
              resetSeconds: 300
              blockSeconds: 300
              baseLevelMin: 12
              baseLevelMax: 20
              levelStep: 1
              maxLevel: 4
          argon2d:
            enabled: false # Allowed when enabled; actual enforcement depends on captchaCombo tokens
            staticLevel: 12
            difficultyTable: "POWDET_DIFFICULTY_STATE"
            dynamic:
              windowSeconds: 60
              resetSeconds: 300
              blockSeconds: 300
              baseLevelMin: 12
              baseLevelMax: 20
              levelStep: 1
              maxLevel: 4
          randomx:
            enabled: false # Allowed when enabled; actual enforcement depends on captchaCombo tokens
            staticLevel: 12
            difficultyTable: "POWDET_DIFFICULTY_STATE"
            staticBaseUrl: "" # Optional override for randomx static assets (highest priority)
            dynamic:
              windowSeconds: 60
              resetSeconds: 300
              blockSeconds: 300
              baseLevelMin: 12
              baseLevelMax: 20
              levelStep: 1
              maxLevel: 4
      db:
        mode: "custom-pg-rest"
        postgrestUrl: "https://postgrest.example.com"
        verifyHeader: ["X-Postgrest-Auth"]
        verifySecret: ["replace-with-postgrest-secret"]
        cleanupPercentage: 5 # set to 0 to disable landing-side cleanup
        cache:
          tableName: "FILESIZE_CACHE_TABLE"
          sizeTTLSeconds: 86400
          cleanupPercentage: 5
        rateLimit:
          enabled: false
          windowSeconds: 60
          limit: 0
          ipv4Suffix: "/32"
          ipv6Suffix: "/60"
          blockSeconds: 600
          pgErrorHandle: "fail-closed"
          fileWindowSeconds: 60
          fileLimit: 0
          fileBlockSeconds: 240
          tableName: "IP_LIMIT_TABLE"
          fileTableName: "IP_FILE_LIMIT_TABLE"
          cleanupPercentage: 5
        idleTable: "DOWNLOAD_LAST_ACTIVE_TABLE"
        idleTimeoutSeconds: 0
      crypt:
        prefix: ""
        includes: []
        encryptionMode: "crypt"
        fileHeaderSize: 32
        blockHeaderSize: 16
        blockDataSize: 65536
        dataKey: ""
      webDownloader:
        enabled: false
        maxConnections: 16
      clientDecryptEnabled: false
      payload:
        minBandwidthMbps: 10
        minDurationSeconds: 3600
        maxDurationSeconds: 0
    download: # Production download config; field meanings match staging.download
      address: "https://alist.example.com"
      override-cache-control: false # Force override upstream Cache-Control in download response; default=false
      cache-override-time: "30m" # Required when override-cache-control=true; supports <number>[s|m|h|d|w|y]
      cache-override-max-size: "500MB" # Max file size eligible for override; supports <number>[B|KB|MB|GB]
      auth:
        ipv4Only: true
      db:
        mode: "custom-pg-rest"
        postgrestUrl: "https://postgrest.example.com"
        verifyHeader: ["X-Postgrest-Auth"]
        verifySecret: ["replace-with-postgrest-secret"]
        cacheEnabled: true
        cacheTable: "DOWNLOAD_CACHE_TABLE"
        linkTTLSeconds: 1800
        cleanupPercentage: 1
        idleTimeoutSeconds: 0
        lastActiveTable: "DOWNLOAD_LAST_ACTIVE_TABLE"
        rateLimit:
          enabled: false
          windowSeconds: 0
          limit: 0
          ipv4Suffix: "/32"
          ipv6Suffix: "/60"
          blockSeconds: 600
          pgErrorHandle: "fail-closed"
          tableName: "DOWNLOAD_IP_RATELIMIT_TABLE"
          cleanupPercentage: 1
      fairQueue:
        enabled: true
        backend: "slot-handler"
        hostPatterns: ["*.sharepoint.com"]
        slotHandlerUrl: "https://slot-handler.example.com"
        slotHandlerAuthKey: "replace-with-slot-handler-key"
        slotHandlerAuthHeader: "X-FQ-Auth"
        slotHandlerTimeoutMs: 20000
        perRequestTimeoutMs: 8000
        maxAttemptsCap: 35
        siteBucket:
          mode: "sharepoint"
      throttleProfiles:
        default:
          hostPatterns: []
          openCapSeconds: 60
          openThresholdPercent: 30
          ewmaSpan: 8
          consecutiveThreshold: 4
          minSamplesBeforeEwmaOpen: 8
          idleResetSeconds: 900
          protectHttpCodes: [429, 499, 500, 502, 503, 504]
      originBindingDefault: "path,asn,country,iprange" # Default binding mode; allowed tokens: ip|iprange|country|continent|region|city|asn|tls|path; empty string disables binding
      paths:
        global:
          defaultProfileId: "download-default"
          decisionTimeoutMs: 200
        pathProfiles:
          - id: "download-default"
            dynamic: false
            actions:
              pathAction: []
              checkOriginMode: "path,asn,country,iprange"
              throttleProfile: "default"
          - id: "download-block-admin"
            dynamic: false
            actions:
              pathAction: ["block"]
              checkOriginMode: "path,asn,country,iprange"
              throttleProfile: "default"
              blockReason: "blocked by rule block_admin"
          - id: "download-public-share"
            dynamic: false
            actions:
              pathAction: []
              checkOriginMode: "path,asn,country,iprange"
              throttleProfile: "default"
          - id: "download-public-share-passthrough"
            dynamic: false
            actions:
              pathAction: ["asis"]
              checkOriginMode: "path,asn,country,iprange"
              throttleProfile: "default"
        pathRules:
          - pattern: "/admin/**"
            profileId: "download-block-admin"
            priority: 300
          - pattern: "/internal/**"
            profileId: "download-block-admin"
            priority: 300
          - pattern: "/share/**"
            profileId: "download-public-share"
            priority: 200
          - pattern: "/share/public/**"
            profileId: "download-public-share-passthrough"
            priority: 100
    powdet: # Same semantics as staging powdet; prod endpoints/tokens
      enabled: true
      listenPort: 2370
      batchSize: 1000
      deprecateAfterBatches: 10
      algorithms:
        argon2id:
          enabled: true
          memoryKiB: 16384
          iterations: 2
          parallelism: 1
          keyLength: 16
        argon2d:
          enabled: false
          memoryKiB: 16384
          iterations: 2
          parallelism: 1
          keyLength: 16
        randomx:
          enabled: false
          jit: true
          hardAes: true
          largePages: false
          seedLen: 32
          cacheLRUSize: 128
          cacheTTL: 600
      adminApiToken: "replace-with-admin-token"
    slotHandler: # slot-handler config for prod; mirrors staging structure
      listen: ":8080"
      logLevel: "info"
      auth:
        enabled: true
        header: "X-FQ-Auth"
        token: "replace-with-slot-handler-key"
      backend:
        mode: "postgrest"
        postgrest:
          baseUrl: "https://postgrest.example.com"
          authHeader: "Bearer replace-with-postgrest-token"
        postgres:
          dsn: "postgres://user:pass@host:5432/dbname?sslmode=disable"
      fairQueue:
        pollIntervalMs: 500
        pollWindowMs: 6000
        minSlotHoldMs: 800
        smoothReleaseIntervalMs: null
        graceMs: 4000
        utilWindowSec: 10 # Utilization window length used by scheduler; seconds >0; source: simple-alist-cf-proxy@845175d/slot-handler/main.go utilWindowSeconds() (current implementation clips >30 to 30)
        maxBatch: 8
        maxProbeParallel: 4
        maxProbeQpsPerHost: 20
        globalMaxInFlightFlow: 300 # in-flight 上限（0 表示禁用该层限制）
        hostMaxInFlightFlow: 100 # in-flight 上限（0 表示禁用该层限制）
        siteMaxInFlightFlow: 50 # in-flight 上限（0 表示禁用该层限制）
        ipBucketMaxInFlightFlow: 10 # in-flight 上限（0 表示禁用该层限制）
        zombieTimeoutSeconds: 30
        ipCooldownSeconds: 0
        hostCaps:
          maxSlotPerHost: 5
          maxSlotPerIp: 1
        siteCaps:
          maxSlotPerSite: 5
          maxSlotPerIp: 1
        rpc:
          tryAcquireFunc: "fq_try_acquire_batch"
          releaseFunc: "fq_release_dual"
        cleanup:
          enabled: true
          intervalSeconds: 1800
